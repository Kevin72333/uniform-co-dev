name: Supabase migrations (manual)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (staging or production)
        required: true
        type: string

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    environment: supabase-migrations
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ inputs.project_ref }}"
      - name: Push migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
